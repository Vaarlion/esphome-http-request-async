# ESPHome hardware test — Tier 4.
#
# Flash this config to an ESP32 on the same network as an httpbin instance, then
# trigger the scripts below via the ESPHome dashboard, HA service calls, or the
# ESPHome CLI to exercise IDF-only code paths that cannot be reached by native
# unit tests or the compile check.
#
# Quick start:
#   1. Run httpbin locally:  docker run -p 8000:80 kennethreitz/httpbin
#   2. Set httpbin_host below to your machine's LAN IP.
#   3. Flash:  esphome run tests/esphome/hardware_test.yaml
#   4. Trigger individual scripts from HA or:
#        esphome run --device <ip> tests/esphome/hardware_test.yaml
#
# What each script tests (and what to look for in the log):
#
#   test_truncation           — body capped at max_response_buffer_size;
#                               expect LOGW "truncated at 64 bytes", body.size()==64
#   test_chunked_content_length — chunked response; expect content_length==body.size()
#   test_collect_headers_filter — only listed header stored; unlisted header absent
#   test_request_header_injection — custom request header echoed by server
#   test_delete_method        — DELETE returns 200
#   test_patch_method         — PATCH returns 200, body echoed
#   test_redirect             — 3 redirects followed, final status 200
#   test_tls_verify_on        — HTTPS with CA bundle; expect 200
#   test_tls_verify_off       — HTTPS with verify_ssl: false; expect 200
#   test_on_error_4xx         — 404 routes to on_error, not on_response
#   test_network_down_fast_fail — disconnect WiFi first; expect on_error immediately
#   test_concurrent_requests  — two requests enqueued simultaneously; both complete

esphome:
  name: http-async-hw-test
  friendly_name: HTTP Async HW Test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG

external_components:
  - source:
      type: local
      path: ../../components
    components: [http_request_async]

# ── Hub: plain HTTP tests (verify_ssl: false) ─────────────────────────────────

http_request_async:
  id: http_client
  timeout: 10s
  verify_ssl: false
  follow_redirects: true
  redirect_limit: 5
  buffer_size_rx: 2048
  buffer_size_tx: 512
  task_stack_size: 8192
  task_priority: 5
  task_count: 2  # needed for test_concurrent_requests

# ── Hub: TLS tests (verify_ssl: true, uses bundled Mozilla CA store) ──────────

http_request_async:
  id: https_client
  timeout: 10s
  verify_ssl: true
  follow_redirects: true
  redirect_limit: 3
  buffer_size_rx: 2048
  buffer_size_tx: 512
  task_stack_size: 10240  # TLS handshake needs a bit more stack
  task_priority: 5

# ── Globals ───────────────────────────────────────────────────────────────────

globals:
  - id: httpbin_host
    type: std::string
    # Replace with your httpbin host:port (no trailing slash).
    initial_value: '"192.168.1.100:8000"'

# ═══════════════════════════════════════════════════════════════════════════════
# Hardware test scripts
# ═══════════════════════════════════════════════════════════════════════════════

script:

  # ── Truncation: body capped at max_response_buffer_size ─────────────────────
  # GET /bytes/4096 returns 4096 random bytes.
  # max_response_buffer_size: 64 → expect LOGW + body.size()==64, content_length==4096.
  - id: test_truncation
    mode: single
    then:
      - http_request_async.get:
          url: !lambda 'return "http://" + id(httpbin_host) + "/bytes/4096";'
          capture_response: true
          max_response_buffer_size: 64
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("hw_test", "[TRUNCATION] PASS: body.size()=%u content_length=%u",
                           body.size(), response->content_length);
                  if (body.size() != 64)
                    ESP_LOGE("hw_test", "[TRUNCATION] FAIL: expected body.size()==64, got %u", body.size());
                  if (response->content_length != 4096)
                    ESP_LOGE("hw_test", "[TRUNCATION] FAIL: expected content_length==4096, got %u",
                             response->content_length);
          on_error:
            then:
              - logger.log:
                  format: "[TRUNCATION] FAIL: on_error fired (status=%d)"
                  args: [response->status_code]

  # ── Chunked response: content_length equals body.size() ─────────────────────
  # GET /stream/5 returns a chunked response (5 JSON lines, no Content-Length header).
  # After the fix, content_length must equal body.size() (not 0).
  - id: test_chunked_content_length
    mode: single
    then:
      - http_request_async.get:
          url: !lambda 'return "http://" + id(httpbin_host) + "/stream/5";'
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("hw_test", "[CHUNKED] body.size()=%u content_length=%u",
                           body.size(), response->content_length);
                  if (response->content_length != body.size())
                    ESP_LOGE("hw_test", "[CHUNKED] FAIL: content_length(%u) != body.size()(%u) — fix not applied?",
                             response->content_length, body.size());
                  else
                    ESP_LOGI("hw_test", "[CHUNKED] PASS");
          on_error:
            then:
              - logger.log: "[CHUNKED] FAIL: on_error"

  # ── collect_headers filter: only requested headers are stored ────────────────
  # GET /response-headers?Content-Type=text/plain makes httpbin return a
  # Content-Type header. We request it; we do NOT request Server.
  # Verify: content-type is present, server is absent.
  - id: test_collect_headers_filter
    mode: single
    then:
      - http_request_async.get:
          url: !lambda |
            return "http://" + id(httpbin_host) + "/response-headers?Content-Type=text%2Fplain";
          capture_response: false
          collect_headers:
            - content-type
          on_response:
            then:
              - lambda: |-
                  auto ct         = response->get_response_header("content-type");
                  auto unrequested = response->get_response_header("server");
                  ESP_LOGI("hw_test", "[HEADERS FILTER] content-type='%s' server='%s'",
                           ct.c_str(), unrequested.c_str());
                  if (ct.empty())
                    ESP_LOGE("hw_test", "[HEADERS FILTER] FAIL: content-type was requested but is empty");
                  else if (!unrequested.empty())
                    ESP_LOGE("hw_test", "[HEADERS FILTER] FAIL: 'server' was NOT requested but is present: '%s'",
                             unrequested.c_str());
                  else
                    ESP_LOGI("hw_test", "[HEADERS FILTER] PASS");
          on_error:
            then:
              - logger.log: "[HEADERS FILTER] FAIL: on_error"

  # ── Request header injection ──────────────────────────────────────────────────
  # GET /headers echoes all request headers in the JSON body.
  # Verify the custom header we set is present in the echoed body.
  - id: test_request_header_injection
    mode: single
    then:
      - http_request_async.get:
          url: !lambda 'return "http://" + id(httpbin_host) + "/headers";'
          capture_response: true
          max_response_buffer_size: 2048
          request_headers:
            X-Hw-Test-Token: "sentinel-abc123"
          on_response:
            then:
              - lambda: |-
                  ESP_LOGI("hw_test", "[HDR INJECT] body=%s", body.c_str());
                  if (body.find("sentinel-abc123") != std::string::npos)
                    ESP_LOGI("hw_test", "[HDR INJECT] PASS: custom header found in server echo");
                  else
                    ESP_LOGE("hw_test", "[HDR INJECT] FAIL: 'sentinel-abc123' not in echoed headers");
          on_error:
            then:
              - logger.log: "[HDR INJECT] FAIL: on_error"

  # ── DELETE method ─────────────────────────────────────────────────────────────
  - id: test_delete_method
    mode: single
    then:
      - http_request_async.send:
          method: DELETE
          url: !lambda 'return "http://" + id(httpbin_host) + "/delete";'
          capture_response: false
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200)
                    ESP_LOGI("hw_test", "[DELETE] PASS: status=%d", response->status_code);
                  else
                    ESP_LOGE("hw_test", "[DELETE] FAIL: status=%d", response->status_code);
          on_error:
            then:
              - logger.log: "[DELETE] FAIL: on_error"

  # ── PATCH method ──────────────────────────────────────────────────────────────
  - id: test_patch_method
    mode: single
    then:
      - http_request_async.send:
          method: PATCH
          url: !lambda 'return "http://" + id(httpbin_host) + "/patch";'
          body: '{"hw_test": true}'
          capture_response: true
          max_response_buffer_size: 2048
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200 && body.find("hw_test") != std::string::npos)
                    ESP_LOGI("hw_test", "[PATCH] PASS: status=%d body echoed", response->status_code);
                  else
                    ESP_LOGE("hw_test", "[PATCH] FAIL: status=%d body=%s",
                             response->status_code, body.c_str());
          on_error:
            then:
              - logger.log: "[PATCH] FAIL: on_error"

  # ── Redirect following ────────────────────────────────────────────────────────
  # /redirect/3 issues 3 HTTP 302 redirects before landing on /get (200).
  - id: test_redirect
    mode: single
    then:
      - http_request_async.get:
          url: !lambda 'return "http://" + id(httpbin_host) + "/redirect/3";'
          capture_response: false
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200)
                    ESP_LOGI("hw_test", "[REDIRECT] PASS: followed 3 redirects, final status=%d",
                             response->status_code);
                  else
                    ESP_LOGE("hw_test", "[REDIRECT] FAIL: status=%d", response->status_code);
          on_error:
            then:
              - logger.log: "[REDIRECT] FAIL: on_error (redirect limit exceeded or network error)"

  # ── TLS: verify_ssl: true ────────────────────────────────────────────────────
  # Uses the https_client hub (CA bundle validation enabled).
  # Requires internet access to httpbin.org.
  - id: test_tls_verify_on
    mode: single
    then:
      - http_request_async.get:
          http_request_async_id: https_client
          url: "https://httpbin.org/get"
          capture_response: false
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200)
                    ESP_LOGI("hw_test", "[TLS VERIFY ON] PASS: CA bundle validation succeeded");
                  else
                    ESP_LOGE("hw_test", "[TLS VERIFY ON] FAIL: status=%d", response->status_code);
          on_error:
            then:
              - logger.log: "[TLS VERIFY ON] FAIL: TLS handshake or CA validation failed"

  # ── TLS: verify_ssl: false ───────────────────────────────────────────────────
  # Uses the http_client hub (verify_ssl: false).
  # Should reach httpbin.org without CA validation.
  - id: test_tls_verify_off
    mode: single
    then:
      - http_request_async.get:
          url: "https://httpbin.org/get"
          capture_response: false
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200)
                    ESP_LOGI("hw_test", "[TLS VERIFY OFF] PASS: HTTPS without CA validation");
                  else
                    ESP_LOGE("hw_test", "[TLS VERIFY OFF] FAIL: status=%d", response->status_code);
          on_error:
            then:
              - logger.log: "[TLS VERIFY OFF] FAIL: on_error"

  # ── 4xx routes to on_error, not on_response ───────────────────────────────────
  # GET /status/404 returns 404. Verify on_error fires, on_response does not.
  - id: test_on_error_4xx
    mode: single
    then:
      - http_request_async.get:
          url: !lambda 'return "http://" + id(httpbin_host) + "/status/404";'
          capture_response: false
          on_response:
            then:
              - logger.log: "[4XX ON_ERROR] FAIL: on_response fired for 404 (should not happen)"
          on_error:
            then:
              - lambda: |-
                  ESP_LOGI("hw_test", "[4XX ON_ERROR] PASS: on_error fired for status=%d",
                           response->status_code);

  # ── Concurrent requests: both complete independently ─────────────────────────
  # Enqueues two requests with no yield between them. Both should complete
  # (processed by two worker tasks) with no dropped requests.
  - id: test_concurrent_requests
    mode: single
    then:
      - http_request_async.get:
          url: !lambda 'return "http://" + id(httpbin_host) + "/delay/1";'
          capture_response: false
          on_response:
            then:
              - logger.log: "[CONCURRENT] request A complete"
          on_error:
            then:
              - logger.log: "[CONCURRENT] request A FAILED"
      - http_request_async.get:
          url: !lambda 'return "http://" + id(httpbin_host) + "/delay/1";'
          capture_response: false
          on_response:
            then:
              - logger.log: "[CONCURRENT] request B complete"
          on_error:
            then:
              - logger.log: "[CONCURRENT] request B FAILED"
