# ESPHome hardware test suite — http_request_async
#
# Self-running: all 13 tests start automatically 1 minute after boot,
# then repeat every 10 minutes. No HA, no button press required.
#
# Quick start:
#   1. python3 tools/test_server.py          (on your dev machine)
#   2. cp tests/esphome/secrets.yaml.example tests/esphome/secrets.yaml
#      Fill in: wifi_ssid, wifi_password, api_key, ota_password
#      Set test_server to your dev machine's LAN IP:8765
#   3. make flash
#   4. make logs          ← tests start ~1 min after boot
#
# Output format in logs:
#   [PASS] N/13  description
#   [FAIL] N/13  description: reason
#   === RESULTS: N passed, M failed ===
#
# Note: the test server must be reachable from the ESP32's network segment.
# If the ESP32 is on an isolated IoT VLAN, allow TCP from that subnet to
# the test server host on port 8765 (both at the router and on the host OS).

substitutions:
  device_name: http-async-hw-test
  test_server: !secret test_server

esphome:
  name: ${device_name}
  friendly_name: HTTP Async HW Test

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG

safe_mode:
  boot_is_good_after: 1min
  reboot_timeout: 5min

external_components:
  - source:
      type: local
      path: ../../components
    components: [http_request_async]

http_request_async:
  id: http_client
  timeout: 10s
  verify_ssl: false
  follow_redirects: true
  redirect_limit: 5
  buffer_size_rx: 2048
  buffer_size_tx: 512
  task_stack_size: 8192
  task_priority: 5
  task_count: 2

globals:
  - id: pass_count
    type: int
    initial_value: "0"
  - id: fail_count
    type: int
    initial_value: "0"
  # 13/13 only: millis() taken just before the nested request is enqueued, so the
  # action that runs after it can prove the chain actually waited.
  - id: nested_t0
    type: uint32_t
    initial_value: "0"
  # 13/13 only: outer body length observed while the nested request's JSON body
  # was being built (synchronously, inside play_complex()).
  - id: nested_seen_len
    type: size_t
    initial_value: "0"

# ═══════════════════════════════════════════════════════════════════════════════
# Test runner — sequential; each HTTP action pauses the chain until the response
# arrives, so tests run one after another without explicit waits.
# ═══════════════════════════════════════════════════════════════════════════════

script:
  - id: run_all_tests
    mode: single
    then:

      - logger.log: "============================================"
      - logger.log: "  http_request_async — hardware test suite "
      - logger.log: "============================================"

      # ── 1/13: GET slow response ───────────────────────────────────────────────
      # /slow?delay=2 holds the connection for 2 s before responding.
      # duration_ms ≥ 2000 proves the real wall-clock time was captured and that
      # the main loop was not blocked (BLE scanning and timers keep firing).
      - logger.log: "[1/13] GET /slow?delay=2 — async + duration ..."
      - http_request_async.get:
          url: "http://${test_server}/slow?delay=2"
          capture_response: false
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200 && response->duration_ms >= 2000) {
                    id(pass_count)++;
                    ESP_LOGI("hw_test", "[PASS] 1/13 GET slow: status=%d duration=%ums",
                             response->status_code, response->duration_ms);
                  } else {
                    id(fail_count)++;
                    ESP_LOGE("hw_test", "[FAIL] 1/13 GET slow: status=%d duration=%ums",
                             response->status_code, response->duration_ms);
                  }
          on_error:
            then:
              - lambda: id(fail_count)++;
              - logger.log: "[FAIL] 1/13 GET slow: on_error fired"

      # ── 2/13: POST with verbatim body ─────────────────────────────────────────
      # /echo echoes the request body in the JSON response (1 s delay).
      - logger.log: "[2/13] POST /echo — body echo ..."
      - http_request_async.post:
          url: "http://${test_server}/echo"
          capture_response: true
          max_response_buffer_size: 2048
          request_headers:
            Content-Type: application/json
          body: '{"hw_test":true,"component":"http_request_async"}'
          on_response:
            then:
              - lambda: |-
                  bool ok = (response->status_code == 200) &&
                            (body.find("hw_test") != std::string::npos);
                  if (ok) {
                    id(pass_count)++;
                    ESP_LOGI("hw_test", "[PASS] 2/13 POST: status=%d body contains 'hw_test'",
                             response->status_code);
                  } else {
                    id(fail_count)++;
                    ESP_LOGE("hw_test", "[FAIL] 2/13 POST: status=%d body=%s",
                             response->status_code, body.c_str());
                  }
          on_error:
            then:
              - lambda: id(fail_count)++;
              - logger.log: "[FAIL] 2/13 POST: on_error fired"

      # ── 3/13: Body truncation ─────────────────────────────────────────────────
      # /bytes?size=4096 returns 4096 random bytes with a Content-Length header.
      # max_response_buffer_size: 64 must cap body.size() at 64 while
      # content_length still reflects the full 4096 from the header.
      - logger.log: "[3/13] Body truncation — /bytes?size=4096, max=64 B ..."
      - http_request_async.get:
          url: "http://${test_server}/bytes?size=4096"
          capture_response: true
          max_response_buffer_size: 64
          on_response:
            then:
              - lambda: |-
                  bool ok = (body.size() == 64) && (response->content_length == 4096);
                  if (ok) {
                    id(pass_count)++;
                    ESP_LOGI("hw_test", "[PASS] 3/13 Truncation: body=%u content_length=%u",
                             body.size(), response->content_length);
                  } else {
                    id(fail_count)++;
                    ESP_LOGE("hw_test",
                             "[FAIL] 3/13 Truncation: body=%u (expect 64) content_length=%u (expect 4096)",
                             body.size(), response->content_length);
                  }
          on_error:
            then:
              - lambda: id(fail_count)++;
              - logger.log: "[FAIL] 3/13 Truncation: on_error fired"

      # ── 4/13: Chunked response content_length ─────────────────────────────────
      # /stream?lines=5 sends 5 JSON lines via chunked TE (no Content-Length).
      # The IDF fix sets content_length = body.size() after the read loop.
      # Expect: content_length > 0 AND content_length == body.size().
      - logger.log: "[4/13] Chunked content_length — /stream?lines=5 ..."
      - http_request_async.get:
          url: "http://${test_server}/stream?lines=5"
          capture_response: true
          max_response_buffer_size: 4096
          on_response:
            then:
              - lambda: |-
                  bool ok = (response->content_length > 0) &&
                            (response->content_length == body.size());
                  if (ok) {
                    id(pass_count)++;
                    ESP_LOGI("hw_test", "[PASS] 4/13 Chunked: content_length=%u == body.size()=%u",
                             response->content_length, body.size());
                  } else {
                    id(fail_count)++;
                    ESP_LOGE("hw_test", "[FAIL] 4/13 Chunked: content_length=%u body.size()=%u",
                             response->content_length, body.size());
                  }
          on_error:
            then:
              - lambda: id(fail_count)++;
              - logger.log: "[FAIL] 4/13 Chunked: on_error fired"

      # ── 5/13: Response headers filter ─────────────────────────────────────────
      # Every server response includes X-Server: http_request_async-test.
      # Collect x-server but NOT content-type.
      # Expect: x-server has the right value; content-type is empty (not stored).
      - logger.log: "[5/13] Response headers filter — /fast ..."
      - http_request_async.get:
          url: "http://${test_server}/fast"
          capture_response: false
          collect_headers:
            - x-server
          on_response:
            then:
              - lambda: |-
                  auto xs = response->get_response_header("x-server");
                  auto ct = response->get_response_header("content-type");
                  bool ok = (xs == "http_request_async-test") && ct.empty();
                  if (ok) {
                    id(pass_count)++;
                    ESP_LOGI("hw_test", "[PASS] 5/13 Headers filter: x-server='%s' content-type=''",
                             xs.c_str());
                  } else {
                    id(fail_count)++;
                    ESP_LOGE("hw_test",
                             "[FAIL] 5/13 Headers filter: x-server='%s' content-type='%s'",
                             xs.c_str(), ct.c_str());
                  }
          on_error:
            then:
              - lambda: id(fail_count)++;
              - logger.log: "[FAIL] 5/13 Headers filter: on_error fired"

      # ── 6/13: Request header injection ────────────────────────────────────────
      # /headers echoes all incoming request headers as JSON in the body.
      # Expect: the custom sentinel value appears in the echoed body.
      - logger.log: "[6/13] Request header injection — /headers ..."
      - http_request_async.get:
          url: "http://${test_server}/headers"
          capture_response: true
          max_response_buffer_size: 2048
          request_headers:
            X-Hw-Test-Token: "sentinel-abc123"
          on_response:
            then:
              - lambda: |-
                  bool ok = (body.find("sentinel-abc123") != std::string::npos);
                  if (ok) {
                    id(pass_count)++;
                    ESP_LOGI("hw_test", "[PASS] 6/13 Header injection: sentinel found in echo");
                  } else {
                    id(fail_count)++;
                    ESP_LOGE("hw_test",
                             "[FAIL] 6/13 Header injection: sentinel not in body: %.200s",
                             body.c_str());
                  }
          on_error:
            then:
              - lambda: id(fail_count)++;
              - logger.log: "[FAIL] 6/13 Header injection: on_error fired"

      # ── 7/13: DELETE method ────────────────────────────────────────────────────
      - logger.log: "[7/13] DELETE method — /delete ..."
      - http_request_async.send:
          method: DELETE
          url: "http://${test_server}/delete"   # DELETE /delete
          capture_response: false
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    id(pass_count)++;
                    ESP_LOGI("hw_test", "[PASS] 7/13 DELETE: status=%d", response->status_code);
                  } else {
                    id(fail_count)++;
                    ESP_LOGE("hw_test", "[FAIL] 7/13 DELETE: status=%d", response->status_code);
                  }
          on_error:
            then:
              - lambda: id(fail_count)++;
              - logger.log: "[FAIL] 7/13 DELETE: on_error fired"

      # ── 8/13: PATCH method ─────────────────────────────────────────────────────
      # /patch echoes the request body in the JSON response.
      - logger.log: "[8/13] PATCH method — /patch ..."
      - http_request_async.send:
          method: PATCH
          url: "http://${test_server}/patch"   # PATCH /patch
          body: '{"hw_test":true}'
          capture_response: true
          max_response_buffer_size: 2048
          on_response:
            then:
              - lambda: |-
                  bool ok = (response->status_code == 200) &&
                            (body.find("hw_test") != std::string::npos);
                  if (ok) {
                    id(pass_count)++;
                    ESP_LOGI("hw_test", "[PASS] 8/13 PATCH: status=%d body echoed",
                             response->status_code);
                  } else {
                    id(fail_count)++;
                    ESP_LOGE("hw_test", "[FAIL] 8/13 PATCH: status=%d body=%s",
                             response->status_code, body.c_str());
                  }
          on_error:
            then:
              - lambda: id(fail_count)++;
              - logger.log: "[FAIL] 8/13 PATCH: on_error fired"

      # ── 9/13: Redirect following ───────────────────────────────────────────────
      # /redirect?n=3 chains three HTTP 302s before landing on /fast (200).
      - logger.log: "[9/13] Redirect following — /redirect?n=3 ..."
      - http_request_async.get:
          url: "http://${test_server}/redirect?n=3"
          capture_response: false
          on_response:
            then:
              - lambda: |-
                  if (response->status_code == 200) {
                    id(pass_count)++;
                    ESP_LOGI("hw_test", "[PASS] 9/13 Redirect: followed 3 hops, final status=%d",
                             response->status_code);
                  } else {
                    id(fail_count)++;
                    ESP_LOGE("hw_test", "[FAIL] 9/13 Redirect: status=%d (expected 200)",
                             response->status_code);
                  }
          on_error:
            then:
              - lambda: id(fail_count)++;
              - logger.log: "[FAIL] 9/13 Redirect: on_error fired (limit exceeded or network error)"

      # ── 10/13: Sequential requests — two back-to-back GETs in one script ────────
      # The second request must not start until the first on_complete fires.
      # Both must succeed. This exercises the play_complex() resume chain.
      - logger.log: "[10/13] Sequential requests — two back-to-back GETs ..."
      - http_request_async.get:
          url: "http://${test_server}/fast"
          capture_response: false
          on_response:
            then:
              - logger.log: "[10/13] Sequential: request A done"
          on_error:
            then:
              - lambda: id(fail_count)++;
              - logger.log: "[FAIL] 10/13 Sequential: request A on_error"
      - http_request_async.get:
          url: "http://${test_server}/fast"
          capture_response: false
          on_response:
            then:
              - lambda: id(pass_count)++;
              - logger.log: "[PASS] 10/13 Sequential: both requests completed"
          on_error:
            then:
              - lambda: id(fail_count)++;
              - logger.log: "[FAIL] 10/13 Sequential: request B on_error"

      # ── 11/13: HTTP 404 routes to on_error, not on_response ───────────────────
      # The component treats 4xx and 5xx as errors. on_response must NOT fire.
      - logger.log: "[11/13] 4xx→on_error — /status/404 ..."
      - http_request_async.get:
          url: "http://${test_server}/status?code=404"
          capture_response: false
          on_response:
            then:
              - lambda: id(fail_count)++;
              - logger.log: "[FAIL] 11/13 4xx→on_error: on_response fired (expected on_error)"
          on_error:
            then:
              - lambda: id(pass_count)++;
              - logger.log: "[PASS] 11/13 4xx→on_error: on_error fired correctly"

      # ── 12/13: HTTP 500 routes to on_error, not on_response ───────────────────
      - logger.log: "[12/13] 5xx→on_error — /status/500 ..."
      - http_request_async.get:
          url: "http://${test_server}/status?code=500"
          capture_response: false
          on_response:
            then:
              - lambda: id(fail_count)++;
              - logger.log: "[FAIL] 12/13 5xx→on_error: on_response fired (expected on_error)"
          on_error:
            then:
              - lambda: id(pass_count)++;
              - logger.log: "[PASS] 12/13 5xx→on_error: on_error fired correctly"

      # ── 13/13: Nested request inside on_response (reference in Ts...) ──────────
      #
      # An http_request_async.* action nested in the on_response of a
      # `capture_response: true` request is code-generated with
      # Ts... = (std::shared_ptr<HttpContainer>, std::string &) — the outer body
      # arrives by non-const reference and is carried through the async round-trip
      # inside the callback closures.
      #
      # Before the const-correctness fix this config did not compile at all, so
      # there was no way to reach it on hardware. It is on the suite now because
      # it is the only test that can catch the *wrong* fix: storing a reference in
      # args_tuple instead of a decayed copy compiles cleanly and passes every
      # native test, but on device the outer on_response stack frame is long gone
      # by the time the nested response arrives — the checks below would then read
      # freed memory (empty, garbage, or a crash inside LoadProhibited).
      #
      # /echo sleeps 1 s, so the elapsed-time check also proves the chain really
      # waited for the nested request rather than racing past it.
      - logger.log: "[13/13] Nested request inside on_response — chained args ..."
      - lambda: id(nested_seen_len) = 0;
      - http_request_async.get:
          url: "http://${test_server}/headers"
          capture_response: true
          max_response_buffer_size: 2048
          request_headers:
            X-Nested-Outer: "outer-sentinel-xyz789"
          on_response:
            then:
              - lambda: id(nested_t0) = millis();
              # Nested async request. Its JSON body is built from the OUTER
              # response body, so TemplatableValue::value(Ts...) and json_func_
              # both receive the std::string & — the two upstream #17713 sites.
              - http_request_async.post:
                  url: "http://${test_server}/echo"
                  capture_response: false
                  request_headers:
                    Content-Type: application/json
                  json: |-
                    id(nested_seen_len) = body.size();
                    root["nested"] = "true";
                    root["outer_len"] = to_string(body.size());
                    root["outer_has_sentinel"] =
                        body.find("outer-sentinel-xyz789") != std::string::npos ? "yes" : "no";
              # Runs only after the nested POST completed, reached via
              # on_complete_cb → play_next_(). `body` here is still the OUTER
              # body, delivered from the closure's own copy.
              - lambda: |-
                  const uint32_t elapsed = millis() - id(nested_t0);
                  const bool waited   = elapsed >= 900;                  // /echo sleeps 1 s
                  const bool intact   = body.find("outer-sentinel-xyz789") != std::string::npos;
                  const bool same_len = id(nested_seen_len) == body.size();
                  if (waited && intact && same_len) {
                    id(pass_count)++;
                    ESP_LOGI("hw_test",
                             "[PASS] 13/13 Nested: chain waited %ums, outer body intact (%u B)",
                             elapsed, (unsigned) body.size());
                  } else {
                    id(fail_count)++;
                    ESP_LOGE("hw_test",
                             "[FAIL] 13/13 Nested: waited=%d (%ums) intact=%d same_len=%d "
                             "(build saw %u B, now %u B)",
                             waited, elapsed, intact, same_len,
                             (unsigned) id(nested_seen_len), (unsigned) body.size());
                  }
          on_error:
            then:
              - lambda: id(fail_count)++;
              - logger.log: "[FAIL] 13/13 Nested: outer request on_error fired"

      # ── Final summary ──────────────────────────────────────────────────────────
      - lambda: |-
          int total = id(pass_count) + id(fail_count);
          ESP_LOGI("hw_test", "============================================");
          if (id(fail_count) == 0) {
            ESP_LOGI("hw_test", "  RESULTS: %d/%d passed — ALL PASS", id(pass_count), total);
          } else {
            ESP_LOGE("hw_test", "  RESULTS: %d passed, %d FAILED (of %d)",
                     id(pass_count), id(fail_count), total);
          }
          ESP_LOGI("hw_test", "============================================");

# ── Auto-run trigger ──────────────────────────────────────────────────────────
# Fires 1 minute after boot (gives WiFi, DHCP, and the API time to stabilise),
# then repeats every 10 minutes. Counters reset at the start of each run.
# script mode:single ensures a second interval tick doesn't overlap a slow run.

interval:
  - interval: 10min
    startup_delay: 1min
    then:
      - lambda: |-
          id(pass_count) = 0;
          id(fail_count) = 0;
      - script.execute: run_all_tests
